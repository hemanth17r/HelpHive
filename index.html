<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
    <meta name="description" content="HelpHive connects you with trusted local helpers and flexible side hustles in your neighborhood. Post tasks or find quick services on demand." />
    <meta name="keywords" content="side hustle, local help, quick help, hyperlocal, gig economy, micro jobs, neighbor help, task runner, local service, HelpHive" />
    <title>HelpHive | Local Help, Side Hustles & Quick Tasks</title>
    
    <!-- Canonical Link -->
    <link rel="canonical" href="https://helphive.me/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://helphive.me/" />
    <meta property="og:title" content="HelpHive | Local Help, Side Hustles & Quick Tasks" />
    <meta property="og:description" content="HelpHive connects you with trusted local helpers and flexible side hustles in your neighborhood. Post tasks or find quick services on demand." />
    <meta property="og:image" content="https://helphive.me/pwa-512x512.png" />
    <meta property="og:site_name" content="HelpHive" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://helphive.me/" />
    <meta property="twitter:title" content="HelpHive | Local Help, Side Hustles & Quick Tasks" />
    <meta property="twitter:description" content="HelpHive connects you with trusted local helpers and flexible side hustles in your neighborhood. Post tasks or find quick services on demand." />
    <meta property="twitter:image" content="https://helphive.me/pwa-512x512.png" />

    <!-- JSON-LD Structured Data for Search Engine & AI Crawler indexing -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "HelpHive",
        "url": "https://helphive.me",
        "logo": "https://helphive.me/favicon.svg",
        "description": "HelpHive is a hyperlocal community platform connecting users with trusted local helpers for tasks, side hustles, quick chores, and micro-jobs.",
        "applicationCategory": "BusinessApplication, UtilitiesApplication",
        "operatingSystem": "All",
        "keywords": "side hustle, local help, quick help, hyperlocal, gig economy, micro jobs, neighbor help, task runner, local service",
        "creator": {
          "@type": "Organization",
          "name": "HelpHive Community",
          "url": "https://helphive.me"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR",
          "description": "Free platform to connect and find helper jobs."
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet.js CDN Links -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Capture PWA install prompt event early to avoid race conditions -->
    <script>
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
