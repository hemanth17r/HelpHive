<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#0033aa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Squircle (rounded box) -->
  <rect x="2" y="2" width="96" height="96" rx="24" ry="24" fill="url(#bg-grad)" filter="url(#shadow)" />
  <!-- Eye Outer White Shape -->
  <path d="M 22 50 C 32 30, 68 30, 78 50 C 68 70, 32 70, 22 50 Z" fill="#ffffff" />
  <!-- Blue Iris (outer circle) -->
  <circle cx="50" cy="50" r="16" fill="#0055e0" />
  <!-- White Pupil (inner circle) -->
  <circle cx="50" cy="50" r="7" fill="#ffffff" />
</svg>
